services:
  backend:
    build: ./backend
    ports:
      - "8020:8020"
    environment:
      - APP_ENV=local
      - PRICE_WATCH_SQLITE_PATH=/srv/app/data/price_watch.sqlite3
    volumes:
      - ./backend/data:/srv/app/data
  frontend:
    build: ./frontend
    ports:
      - "5200:5200"
    environment:
      # 前端容器里的 127.0.0.1 是它自己，必须走 Compose 服务名访问后端。
      VITE_PROXY_TARGET: http://backend:8020
    depends_on:
      - backend
